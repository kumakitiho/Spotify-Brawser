<svg width="1400" height="860" viewBox="0 0 1400 860" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Realistic Record Player UI Mock</title>
  <desc id="desc">A realistic top-down DJ turntable style mock based on the provided reference image, with a large platter, strobe dots, S-shaped tonearm, pitch slider, and start/stop controls.</desc>
  <defs>
    <linearGradient id="plinth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f5f0"/>
      <stop offset="0.52" stop-color="#d8d9d4"/>
      <stop offset="1" stop-color="#aeb1ad"/>
    </linearGradient>
    <linearGradient id="plinthEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#6f746f" stop-opacity="0.52"/>
    </linearGradient>
    <radialGradient id="record" cx="43%" cy="36%" r="66%">
      <stop offset="0" stop-color="#202422"/>
      <stop offset="0.38" stop-color="#0b0d0c"/>
      <stop offset="0.74" stop-color="#050606"/>
      <stop offset="1" stop-color="#151817"/>
    </radialGradient>
    <radialGradient id="label" cx="36%" cy="28%" r="72%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#eeeeea"/>
      <stop offset="1" stop-color="#b8bab6"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.28" stop-color="#c7c9c7"/>
      <stop offset="0.56" stop-color="#f2f3ef"/>
      <stop offset="1" stop-color="#787d7b"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#545957"/>
      <stop offset="1" stop-color="#161918"/>
    </linearGradient>
    <filter id="deepShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.34"/>
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.30"/>
    </filter>
    <filter id="needleGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#1DB954" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#1DB954" flood-opacity="0.35"/>
    </filter>
    <pattern id="brushed" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <rect width="9" height="9" fill="transparent"/>
      <path d="M0 1 H9" stroke="#fff" stroke-opacity="0.15" stroke-width="1"/>
      <path d="M0 7 H9" stroke="#4d524f" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <style>
      .title { fill: #101211; font: 800 28px Inter, Arial, sans-serif; letter-spacing: -0.03em; }
      .caption { fill: #3f4441; font: 600 14px Inter, Arial, sans-serif; letter-spacing: .03em; }
      .tiny { fill: #2d312f; font: 700 10px Inter, Arial, sans-serif; letter-spacing: .08em; }
      .ticks { stroke: #3b403d; stroke-width: 1; opacity: .72; }
      .record-spin { transform-origin: 560px 430px; animation: spin 7s linear infinite; }
      .strobe-spin { transform-origin: 560px 430px; animation: spin 12s linear infinite reverse; }
      .platter-breathe { animation: breathe 2s ease-in-out infinite alternate; }
      .shine { animation: shine 4s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes breathe { from { opacity: .26; } to { opacity: .52; } }
      @keyframes shine { 0%,100% { opacity: .16; } 50% { opacity: .42; } }
    </style>
  </defs>

  <rect width="1400" height="860" rx="42" fill="#111"/>
  <rect x="50" y="50" width="1300" height="760" rx="22" fill="url(#plinth)" stroke="#5f6460" stroke-width="3" filter="url(#deepShadow)"/>
  <rect x="58" y="58" width="1284" height="744" rx="17" fill="url(#brushed)" opacity="0.6"/>
  <path d="M58 80 Q58 58 80 58 H1320 Q1342 58 1342 80" fill="none" stroke="url(#plinthEdge)" stroke-width="9" opacity="0.72"/>

  <text x="82" y="94" class="title">Realistic Shelf Mode Turntable</text>
  <text x="84" y="119" class="caption">TOP-DOWN PLATTER / S-SHAPED TONEARM / PITCH CONTROL / START-STOP PANEL</text>

  <!-- 45 adapter / top-left metal disc -->
  <g filter="url(#smallShadow)">
    <circle cx="148" cy="143" r="48" fill="url(#metal)" stroke="#222" stroke-width="3"/>
    <circle cx="148" cy="143" r="6" fill="#7a7d79"/>
    <path d="M148 143 L118 116" stroke="#fff" stroke-width="2" opacity=".55"/>
    <path d="M148 143 L190 133" stroke="#2d302e" stroke-width="2" opacity=".28"/>
  </g>

  <!-- main platter and record -->
  <g filter="url(#deepShadow)">
    <circle cx="560" cy="430" r="369" fill="#232725" stroke="#737873" stroke-width="4"/>
    <circle cx="560" cy="430" r="354" fill="#171a19" stroke="#040505" stroke-width="3"/>
    <g class="strobe-spin">
      <circle cx="560" cy="430" r="358" fill="none" stroke="#e5e6de" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 10" opacity="0.9"/>
      <circle cx="560" cy="430" r="344" fill="none" stroke="#f6f7ef" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 8" opacity="0.82"/>
      <circle cx="560" cy="430" r="332" fill="none" stroke="#9ca19c" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 7" opacity="0.62"/>
    </g>
    <g class="record-spin">
      <circle cx="560" cy="430" r="318" fill="url(#record)" stroke="#090a09" stroke-width="6"/>
      <circle cx="560" cy="430" r="292" fill="none" stroke="#343936" stroke-width="1" opacity="0.7"/>
      <circle cx="560" cy="430" r="262" fill="none" stroke="#313633" stroke-width="1" opacity="0.62"/>
      <circle cx="560" cy="430" r="232" fill="none" stroke="#2b302d" stroke-width="1" opacity="0.58"/>
      <circle cx="560" cy="430" r="202" fill="none" stroke="#2b302d" stroke-width="1" opacity="0.52"/>
      <circle cx="560" cy="430" r="172" fill="none" stroke="#343936" stroke-width="1" opacity="0.45"/>
      <circle cx="560" cy="430" r="137" fill="#050606" opacity="0.72"/>
      <circle cx="560" cy="430" r="88" fill="url(#label)" stroke="#d0d2cc" stroke-width="2"/>
      <circle cx="560" cy="430" r="10" fill="url(#metal)" stroke="#4e5450" stroke-width="2"/>
      <path d="M343 232 C455 135 662 113 804 224" fill="none" stroke="#fff" stroke-width="18" stroke-opacity="0.05" class="shine"/>
    </g>
    <circle cx="560" cy="430" r="11" fill="none" stroke="#111" stroke-width="2"/>
  </g>

  <!-- start/stop and lower controls -->
  <g transform="translate(85 650)" filter="url(#smallShadow)">
    <rect x="0" y="0" width="112" height="84" rx="3" fill="#f3f4ef" stroke="#2b302d" stroke-width="4"/>
    <text x="26" y="48" class="tiny">start · stop</text>
    <rect x="124" y="58" width="140" height="18" rx="2" fill="#f0f1ec" stroke="#383d3a" stroke-width="3"/>
    <circle cx="172" cy="67" r="5" fill="#323734"/>
    <circle cx="232" cy="67" r="5" fill="#323734"/>
    <text x="132" y="53" class="tiny">33</text>
    <text x="214" y="53" class="tiny">45</text>
  </g>

  <g transform="translate(91 580)" filter="url(#smallShadow)">
    <circle cx="34" cy="34" r="34" fill="url(#darkMetal)" stroke="#1d211f" stroke-width="3"/>
    <circle cx="34" cy="34" r="25" fill="none" stroke="#a5aaa5" stroke-width="2" opacity=".45"/>
    <path d="M34 34 L53 24" stroke="#f5f6f1" stroke-width="2" opacity=".55"/>
  </g>

  <!-- small status buttons near platter bottom -->
  <g transform="translate(777 667)" filter="url(#smallShadow)">
    <rect x="0" y="0" width="74" height="28" rx="14" fill="#575d58" stroke="#252a27" stroke-width="3"/>
    <circle cx="24" cy="14" r="10" fill="url(#metal)"/>
    <circle cx="52" cy="14" r="8" fill="#2e3330"/>
  </g>

  <!-- tonearm base assembly -->
  <g filter="url(#deepShadow)">
    <circle cx="1102" cy="254" r="120" fill="#111514" stroke="#303532" stroke-width="6"/>
    <circle cx="1102" cy="254" r="93" fill="#d9dbd4" stroke="#4d534f" stroke-width="4" opacity="0.88"/>
    <circle cx="1102" cy="254" r="66" fill="#b8bbb5" stroke="#4e5550" stroke-width="4"/>
    <circle cx="1102" cy="254" r="42" fill="#eef0ea" stroke="#5c625e" stroke-width="4"/>
    <circle cx="1102" cy="254" r="13" fill="url(#metal)" stroke="#2c302e" stroke-width="3"/>
    <path d="M1058 205 C1085 189 1124 194 1144 222" fill="none" stroke="#777e78" stroke-width="13" stroke-linecap="round" opacity=".76"/>
    <path d="M1042 265 C1063 304 1118 323 1160 287" fill="none" stroke="#676e69" stroke-width="12" stroke-linecap="round" opacity=".58"/>
    <circle cx="1020" cy="190" r="9" fill="#262b28"/>
    <circle cx="1183" cy="203" r="9" fill="#262b28"/>
    <circle cx="1019" cy="316" r="9" fill="#262b28"/>
  </g>

  <!-- counterweight -->
  <g filter="url(#smallShadow)">
    <rect x="1091" y="95" width="82" height="42" rx="10" fill="url(#metal)" stroke="#404541" stroke-width="4"/>
    <path d="M1095 105 H1169 M1095 115 H1169 M1095 125 H1169" stroke="#616862" stroke-width="2" opacity=".55"/>
    <rect x="1114" y="134" width="36" height="44" rx="7" fill="url(#metal)" stroke="#4e5450" stroke-width="3"/>
  </g>

  <!-- S-shaped tonearm, always connected to the pivot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 1102 254;0 1102 254;18 1102 254;18 1102 254;2 1102 254;2 1102 254" keyTimes="0;0.12;0.28;0.55;0.78;1" dur="7s" repeatCount="indefinite"/>
    <path d="M1102 254 C1051 304 1059 402 1034 493 C1019 547 984 614 914 681" fill="none" stroke="#777e79" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1102 254 C1051 304 1059 402 1034 493 C1019 547 984 614 914 681" fill="none" stroke="url(#metal)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1091 267 C1049 314 1055 404 1030 491 C1014 544 979 608 910 673" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    <circle cx="1102" cy="254" r="16" fill="url(#metal)" stroke="#313632" stroke-width="4"/>

    <!-- headshell and cartridge -->
    <g transform="translate(888 665) rotate(-25)">
      <rect x="0" y="0" width="82" height="54" rx="8" fill="#1c211f" stroke="#060807" stroke-width="3"/>
      <rect x="9" y="8" width="58" height="12" rx="5" fill="#3f4641"/>
      <circle cx="18" cy="31" r="5" fill="#d6d8d2"/>
      <circle cx="39" cy="31" r="5" fill="#d6d8d2"/>
      <circle cx="60" cy="31" r="5" fill="#d6d8d2"/>
      <path d="M74 43 L96 50" stroke="#111" stroke-width="5" stroke-linecap="round"/>
      <path d="M75 50 L99 58" stroke="#1DB954" stroke-width="4" stroke-linecap="round" filter="url(#needleGlow)">
        <animate attributeName="opacity" values="0.25;0.25;0.25;0.25;1;1" keyTimes="0;0.16;0.30;0.76;0.88;1" dur="7s" repeatCount="indefinite"/>
      </path>
      <circle cx="99" cy="58" r="4" fill="#1DB954" filter="url(#needleGlow)">
        <animate attributeName="r" values="2;2;2;2;7;4" keyTimes="0;0.18;0.30;0.78;0.90;1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.2;0.2;0.2;1;1" keyTimes="0;0.18;0.30;0.78;0.90;1" dur="7s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- arm rest and cue lever -->
  <g filter="url(#smallShadow)">
    <rect x="1196" y="250" width="24" height="112" rx="10" fill="#202523" stroke="#111" stroke-width="3" transform="rotate(-18 1196 250)"/>
    <path d="M1160 320 L1202 383" stroke="#171b19" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- pitch slider -->
  <g transform="translate(1190 392)" filter="url(#smallShadow)">
    <rect x="0" y="0" width="92" height="288" fill="#f3f4ee" stroke="#565c57" stroke-width="3"/>
    <line x1="48" y1="36" x2="48" y2="252" stroke="#1b201e" stroke-width="4"/>
    <g class="ticks">
      <line x1="20" y1="36" x2="38" y2="36"/><line x1="20" y1="60" x2="34" y2="60"/><line x1="20" y1="84" x2="38" y2="84"/>
      <line x1="20" y1="108" x2="34" y2="108"/><line x1="20" y1="132" x2="38" y2="132"/><line x1="20" y1="156" x2="34" y2="156"/>
      <line x1="20" y1="180" x2="38" y2="180"/><line x1="20" y1="204" x2="34" y2="204"/><line x1="20" y1="228" x2="38" y2="228"/>
      <line x1="58" y1="36" x2="76" y2="36"/><line x1="62" y1="60" x2="76" y2="60"/><line x1="58" y1="84" x2="76" y2="84"/>
      <line x1="62" y1="108" x2="76" y2="108"/><line x1="58" y1="132" x2="76" y2="132"/><line x1="62" y1="156" x2="76" y2="156"/>
      <line x1="58" y1="180" x2="76" y2="180"/><line x1="62" y1="204" x2="76" y2="204"/><line x1="58" y1="228" x2="76" y2="228"/>
    </g>
    <rect x="25" y="126" width="48" height="31" rx="4" fill="url(#metal)" stroke="#3e4440" stroke-width="3">
      <animate attributeName="y" values="126;126;112;112;133;126" keyTimes="0;0.30;0.50;0.65;0.82;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="24" y="274" class="tiny">pitch adj.</text>
  </g>

  <!-- sequence label -->
  <g transform="translate(862 733)">
    <rect x="0" y="0" width="126" height="13" rx="7" fill="#1DB954">
      <animate attributeName="opacity" values="1;1;0.28;0.28;0.28;1" keyTimes="0;0.18;0.30;0.58;0.84;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="145" y="0" width="126" height="13" rx="7" fill="#1DB954">
      <animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.30;0.44;0.56;0.70;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="290" y="0" width="142" height="13" rx="7" fill="#1DB954">
      <animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.56;0.70;0.78;0.88;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="42" class="tiny">1 LIFT NEEDLE</text>
    <text x="145" y="42" class="tiny">2 SET RECORD</text>
    <text x="290" y="42" class="tiny">3 DROP NEEDLE</text>
  </g>
</svg>
