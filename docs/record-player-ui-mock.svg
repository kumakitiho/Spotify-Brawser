<svg width="1400" height="860" viewBox="0 0 1400 860" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Record Player UI AS-IS / TO-BE Mock</title>
  <desc id="desc">A two-column visual mock comparing the current flat shelf mode and the proposed animated realistic record player UI.</desc>
  <defs>
    <radialGradient id="vinyl" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#2b2b2b"/>
      <stop offset="42%" stop-color="#080808"/>
      <stop offset="75%" stop-color="#020202"/>
      <stop offset="100%" stop-color="#101010"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#242424"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1DB954"/>
      <stop offset="1" stop-color="#6df0a3"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.44"/>
    </filter>
    <filter id="greenGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#1DB954" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#1DB954" flood-opacity="0.35"/>
    </filter>
    <style>
      .bg { fill: #121212; }
      .label { fill: #f3f4f6; font: 700 30px Inter, Arial, sans-serif; letter-spacing: -0.02em; }
      .caption { fill: #b3b3b3; font: 500 17px Inter, Arial, sans-serif; }
      .small { fill: #d1d5db; font: 700 14px Inter, Arial, sans-serif; letter-spacing: 0.08em; }
      .note { fill: #9ca3af; font: 500 15px Inter, Arial, sans-serif; }
      .chip { fill: #1DB954; font: 800 13px Inter, Arial, sans-serif; letter-spacing: 0.14em; }
      .pulse { animation: pulse 1.8s ease-in-out infinite alternate; }
      .shine { animation: shine 3.8s ease-in-out infinite; }
      @keyframes pulse { from { opacity: .35; } to { opacity: .95; } }
      @keyframes shine { 0%, 100% { opacity: .15; } 50% { opacity: .55; } }
    </style>
  </defs>

  <rect class="bg" width="1400" height="860" rx="40"/>
  <text x="70" y="72" class="label">Record Player UI AS-IS / TO-BE</text>
  <text x="70" y="105" class="caption">Spotifyの統計画面に“触って聴くレコード体験”を追加するための見た目イメージ</text>

  <!-- AS IS -->
  <g transform="translate(70 150)">
    <rect width="590" height="640" rx="34" fill="#181818" stroke="#2a2a2a"/>
    <text x="36" y="56" class="chip">AS-IS</text>
    <text x="36" y="92" class="label" font-size="28">まだ“置いてあるだけ”に見える</text>
    <text x="36" y="126" class="caption">黒い円盤・ジャケット・棚はあるが、体験の主役が弱い</text>

    <rect x="80" y="170" width="430" height="330" rx="30" fill="#202020" stroke="#303030" filter="url(#softShadow)"/>
    <circle cx="250" cy="335" r="122" fill="#050505" stroke="#252525" stroke-width="10"/>
    <circle cx="250" cy="335" r="70" fill="#282828"/>
    <rect x="200" y="285" width="100" height="100" rx="16" fill="#3a3a3a"/>
    <circle cx="250" cy="335" r="9" fill="#cfcfcf"/>
    <line x1="405" y1="220" x2="320" y2="330" stroke="#8b8b8b" stroke-width="10" stroke-linecap="round"/>
    <circle cx="410" cy="220" r="24" fill="#303030" stroke="#5a5a5a" stroke-width="5"/>
    <rect x="394" y="316" width="34" height="20" rx="6" fill="#777" transform="rotate(-50 394 316)"/>

    <g transform="translate(62 540)">
      <rect width="96" height="96" rx="16" fill="#2a2a2a"/>
      <rect x="116" width="96" height="96" rx="16" fill="#2a2a2a"/>
      <rect x="232" width="96" height="96" rx="16" fill="#2a2a2a"/>
      <rect x="348" width="96" height="96" rx="16" fill="#2a2a2a"/>
      <text x="0" y="128" class="note">操作: タップ/ドラッグはできるが、状態の気持ちよさが薄い</text>
    </g>
  </g>

  <!-- TO BE -->
  <g transform="translate(740 150)">
    <rect width="590" height="640" rx="34" fill="#0c0c0c" stroke="#254532"/>
    <circle cx="470" cy="110" r="190" fill="#1DB954" opacity="0.10" class="pulse"/>
    <text x="36" y="56" class="chip">TO-BE</text>
    <text x="36" y="92" class="label" font-size="28">“針を落として聴く”UIにする</text>
    <text x="36" y="126" class="caption">浮かす → 逃がす → 盤を置く → 寄せる → 沈める</text>

    <rect x="54" y="158" width="482" height="382" rx="38" fill="url(#panel)" stroke="#3a3a3a" filter="url(#softShadow)"/>
    <path d="M86 192 C178 148, 325 148, 505 202" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="18" class="shine"/>

    <circle cx="280" cy="350" r="151" fill="#050505" opacity="0.42"/>
    <circle cx="280" cy="350" r="158" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="650 340" filter="url(#greenGlow)">
      <animate attributeName="opacity" values="0.20;0.20;0.95;0.42;0.42" keyTimes="0;0.30;0.48;0.64;1" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- the record is set after the tonearm has moved out of the way -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -46;0 -46;0 10;0 0;0 0" keyTimes="0;0.32;0.46;0.54;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.28;0.28;1;1;1" keyTimes="0;0.30;0.48;0.54;1" dur="7s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 280 350" to="360 280 350" dur="6s" repeatCount="indefinite"/>
        <circle cx="280" cy="350" r="142" fill="url(#vinyl)" stroke="#2f2f2f" stroke-width="14"/>
        <circle cx="280" cy="350" r="120" fill="none" stroke="#fff" stroke-opacity="0.10" stroke-width="1"/>
        <circle cx="280" cy="350" r="101" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="1"/>
        <circle cx="280" cy="350" r="82" fill="none" stroke="#fff" stroke-opacity="0.06" stroke-width="1"/>
        <rect x="220" y="290" width="120" height="120" rx="24" fill="#30483a" stroke="#87efac" stroke-opacity="0.55"/>
        <path d="M224 380 L338 292 L338 408 L224 408Z" fill="#1DB954" opacity="0.55"/>
        <circle cx="280" cy="350" r="22" fill="#e5e7eb" stroke="#101010" stroke-width="10"/>
        <circle cx="280" cy="350" r="6" fill="#d1d5db"/>
      </g>
    </g>

    <g class="arm">
      <!-- fixed tonearm base: the pivot should not move -->
      <circle cx="440" cy="238" r="28" fill="#252525" stroke="#1DB954" stroke-width="5"/>
      <circle cx="440" cy="238" r="13" fill="#3a3a3a" stroke="#0c0c0c" stroke-width="4"/>
      <circle cx="440" cy="238" r="5" fill="#d1d5db"/>

      <!-- rotate the arm out first, then bring it back toward the record -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-8 440 238;-8 440 238;-31 440 238;-31 440 238;-12 440 238;-12 440 238" keyTimes="0;0.12;0.28;0.56;0.76;1" dur="7s" repeatCount="indefinite"/>
        <!-- lift the arm while it moves, then drop the needle after it reaches the groove -->
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -18;0 -18;0 -18;0 -18;0 0;0 0" keyTimes="0;0.12;0.28;0.58;0.76;0.86;1" dur="7s" repeatCount="indefinite"/>
          <line x1="420" y1="255" x2="300" y2="348" stroke="#d8d8d8" stroke-width="10" stroke-linecap="round"/>
          <line x1="420" y1="255" x2="300" y2="348" stroke="#5f5f5f" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
          <rect x="275" y="342" width="44" height="26" rx="8" fill="#e5e7eb" stroke="#1DB954" stroke-width="5" transform="rotate(-32 275 342)"/>
          <circle cx="299" cy="366" r="4" fill="#1DB954">
            <animate attributeName="r" values="4;4;4;7;4" keyTimes="0;0.78;0.86;0.90;1" dur="7s" repeatCount="indefinite"/>
          </circle>
        </g>
      </g>
    </g>

    <g transform="translate(96 562)">
      <rect width="110" height="12" rx="6" fill="#1DB954">
        <animate attributeName="opacity" values="1;1;0.28;0.28;0.28;1" keyTimes="0;0.16;0.30;0.58;0.84;1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <rect x="124" width="110" height="12" rx="6" fill="#1DB954">
        <animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.30;0.44;0.56;0.70;1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <rect x="248" width="132" height="12" rx="6" fill="#1DB954">
        <animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.56;0.70;0.78;0.88;1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <text x="0" y="43" class="small">1 LIFT ARM</text>
      <text x="124" y="43" class="small">2 SET RECORD</text>
      <text x="248" y="43" class="small">3 DROP NEEDLE</text>
      <text x="0" y="70" class="note">針を浮かせて外へ逃がし、盤を置いてから溝へ落とす</text>
    </g>
  </g>
</svg>
