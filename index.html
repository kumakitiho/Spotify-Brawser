<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050706">
  <title>Record Room</title>
  <link rel="preconnect" href="https://accounts.scdn.co">
  <link rel="stylesheet" href="src/styles.css?v=20260712-record-room-v1">
</head>
<body>
  <div id="app" class="app-shell" data-theme="midnight">
    <section id="auth-view" class="auth-view" aria-labelledby="auth-title">
      <div class="auth-backdrop" aria-hidden="true"></div>
      <div class="auth-card">
        <p class="eyebrow">Your listening room</p>
        <h1 id="auth-title">Spotifyから、今夜のレコード棚をつくる。</h1>
        <p class="auth-copy">最近の沼、いまの定番、ずっと残る曲を12枚の棚にして、盤を選び、針を落として聴くためのRecord Roomです。</p>
        <button id="login-button" class="primary-button" type="button">Spotifyで部屋を開く</button>
        <p id="auth-message" class="status-text" role="status"></p>
      </div>
    </section>

    <section id="room-view" class="room-view" hidden>
      <header class="room-header">
        <div class="brand-block">
          <span class="brand-disc" aria-hidden="true"></span>
          <div>
            <p class="eyebrow">Listening room</p>
            <strong>Record Room</strong>
          </div>
        </div>
        <div class="header-actions">
          <label class="theme-picker">
            <span>Scene</span>
            <select id="theme-select" aria-label="シーンを変更">
              <option value="midnight">Midnight</option>
              <option value="amber">Amber</option>
              <option value="neon">Neon</option>
            </select>
          </label>
          <button id="logout-button" class="ghost-button" type="button">退出</button>
        </div>
      </header>

      <main class="room-main">
        <section class="now-section" aria-live="polite">
          <p id="track-reason" class="eyebrow">Tonight's crate</p>
          <h1 id="track-title">棚を準備しています</h1>
          <p id="track-artist" class="track-artist">Spotifyのトップトラックを読み込み中</p>
        </section>

        <section class="deck-layout">
          <div id="deck-stage" class="deck-stage" aria-label="レコードプレーヤー">
            <div class="ambient-ring" aria-hidden="true"></div>
            <div class="turntable">
              <button id="vinyl-button" class="vinyl-button" type="button" aria-label="再生または停止">
                <span class="vinyl-grooves" aria-hidden="true"></span>
                <img id="vinyl-label" class="vinyl-label" alt="">
                <span class="spindle" aria-hidden="true"></span>
              </button>
              <div class="tonearm" aria-hidden="true">
                <span class="tonearm-pivot"></span>
                <span class="tonearm-bar"></span>
                <span class="cartridge"></span>
              </div>
              <span class="power-light" aria-hidden="true"></span>
            </div>
          </div>

          <section class="control-panel" aria-label="再生コントロール">
            <div class="progress-wrap">
              <input id="seek" type="range" min="0" max="1000" value="0" aria-label="再生位置">
              <div class="time-row"><span id="current-time">0:00</span><span id="total-time">0:00</span></div>
            </div>
            <div class="transport-row">
              <button id="prev-button" class="transport-button" type="button" aria-label="前のレコード">前へ</button>
              <button id="play-button" class="play-button" type="button" aria-label="再生">再生</button>
              <button id="next-button" class="transport-button" type="button" aria-label="次のレコード">次へ</button>
            </div>
            <div class="utility-row">
              <button id="surprise-button" class="utility-button" type="button">おまかせで選ぶ</button>
              <button id="compare-button" class="utility-button" type="button">今と昔を比べる</button>
            </div>
            <p id="playback-status" class="status-text" role="status"></p>
          </section>
        </section>

        <section class="crate-section" aria-labelledby="crate-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Curated from your history</p>
              <h2 id="crate-title">今夜の12枚</h2>
            </div>
            <p class="swipe-hint">横にスワイプして選択</p>
          </div>
          <div id="crate" class="crate" role="list"></div>
        </section>

        <section class="insight-grid">
          <article class="insight-card">
            <p class="eyebrow">Then vs now</p>
            <h2>最近の一曲と、ずっと残る一曲</h2>
            <div id="comparison-content" class="comparison-content"></div>
          </article>
          <article class="insight-card">
            <p class="eyebrow">Session tape</p>
            <h2>この部屋で針を落とした盤</h2>
            <div id="session-tape" class="session-tape"></div>
          </article>
        </section>
      </main>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <audio id="preview-audio" preload="none"></audio>
  <script src="config.js?v=20260712-record-room-v1"></script>
  <script type="module" src="src/main.js?v=20260712-record-room-v1"></script>
</body>
</html>
