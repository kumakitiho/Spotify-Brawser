    <ellipse cx="610" cy="560" rx="286" ry="202" stroke="#d3fff9" stroke-opacity=".44" stroke-width="2"/>
    <ellipse cx="610" cy="560" rx="216" ry="151" stroke="#7fe8df" stroke-opacity=".42" stroke-width="2" stroke-dasharray="6 17"/>
  </g>
  <g filter="url(#glow)" opacity=".62">
    <path d="M-60 700 C210 470 360 620 580 430 S990 340 1290 110" fill="none" stroke="#70f1e2" stroke-width="54"/>
    <path d="M-100 860 C230 610 410 760 650 560 S1010 450 1290 300" fill="none" stroke="#0dc2cb" stroke-width="36"/>
  </g>
