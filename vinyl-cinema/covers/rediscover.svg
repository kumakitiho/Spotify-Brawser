  <text x="86" y="1080" fill="#fff8df" font-family="Arial,Helvetica,sans-serif" font-size="82" font-weight="700" letter-spacing="-4">FORGOTTEN LIGHT</text>
  <text x="92" y="1128" fill="#fff8df" fill-opacity=".66" font-family="Arial,Helvetica,sans-serif" font-size="24" letter-spacing="8">RETURNING MEMORY</text>
